<style>
        #myMap1 {
		   height: 200px;
		   width: 400px;
		}
        </style>
        <script src="https://maps.googleapis.com/maps/api/js?v=3.exp&sensor=false"></script>
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
        <script type="text/javascript"> 
            var map1;
            var marker1;
            var myLatlng = new google.maps.LatLng(13.053085074428376,80.21314787274173);
            var geocoder = new google.maps.Geocoder();
            var infowindow = new google.maps.InfoWindow();
            function initialize1(){
                var mapOptions = {
                    zoom: 14,
                    center: myLatlng,
                    mapTypeId: google.maps.MapTypeId.ROADMAP
                };
		       
                map = new google.maps.Map(document.getElementById("myMap1"), mapOptions);
                
                marker1 = new google.maps.Marker({
                    map: map,
                    position: myLatlng,
                    draggable: true 
                });     
                
                geocoder.geocode({'latLng': myLatlng }, function(results, status) {
                    if (status == google.maps.GeocoderStatus.OK) {
                        if (results[0]) {
                            $('#address1').val(results[0].formatted_address);
                            $('#latitude1').val(marker1.getPosition().lat());
                            $('#longitude1').val(marker1.getPosition().lng());
                            infowindow.setContent(results[0].formatted_address);
                            infowindow.open(map, marker1);
                        }
                    }
                });

                               
                google.maps.event.addListener(marker1, 'dragend', function() {

                geocoder.geocode({'latLng': marker1.getPosition()}, function(results, status) {
                    if (status == google.maps.GeocoderStatus.OK) {
                        if (results[0]) {
                            $('#address1').val(results[0].formatted_address);
                            $('#latitude1').val(marker1.getPosition().lat());
                            $('#longitude1').val(marker1.getPosition().lng());
                            infowindow.setContent(results[0].formatted_address);
                            infowindow.open(map, marker1);
                        }
                    }
                });
            });
            
            }
            
            google.maps.event.addDomListener(popup1, 'click', initialize1);
        </script> 
        	<div id="myMap1"></div><br/>
            <div>
            	<input type="text" id="address1" name="doc_address1" placeholder="Address"/>
                <input type="text" id="latitude1" name="doc_latitude1" placeholder="Latitude"/>
                <input type="text" id="longitude1" name="doc_longitude1" placeholder="Longitude"/>
            </div>
