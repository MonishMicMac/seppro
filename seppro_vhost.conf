<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html/seppro

	Alias /seppro /var/www/html/seppro
	Alias /bio_pheonix /var/www/html/seppro/bio_pheonix
	Alias /chit_funds /var/www/html/seppro/chit_funds
	Alias /gmc /var/www/html/seppro/gmc
	Alias /gm_chit_funds /var/www/html/seppro/gm_chit_funds
	Alias /ourangels /var/www/html/seppro/ourangels

	<Directory /var/www/html/seppro>
		Options Indexes FollowSymLinks MultiViews
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

